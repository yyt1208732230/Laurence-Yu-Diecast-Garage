<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laurence Yu's Garage</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.default.min.css" rel="stylesheet">
    
    <style>
        /* ==================== CSS 样式区域 ==================== */
        :root {
            --bg-color: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent-color: #000000;
            --card-bg: #f9f9f9;
            --card-hover: #ffffff;
            --font-main: 'Inter', sans-serif;
            --font-display: 'Playfair Display', serif;
        }

        body { font-family: var(--font-main); background-color: var(--bg-color); color: var(--text-primary); margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 5%; background: #fff; border-bottom: 1px solid #f0f0f0; }
        .brand-area { display: flex; align-items: center; gap: 15px; }
        .site-logo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid #eee; background: #eee; }
        .logo-text { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: #000; }
        .logo-text span { font-weight: 400; font-style: italic; color: #555; }
        .lang-switch button { background: none; border: none; cursor: pointer; font-size: 0.9rem; color: var(--text-secondary); transition: color 0.2s;}
        .lang-switch button.active { color: var(--accent-color); font-weight: bold; text-decoration: underline; }

        /* Hero Section */
        .hero-section { width: 100%; height: 35vh; min-height: 220px; position: relative; overflow: hidden; margin-bottom: 2rem; background: #333; }
        .hero-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }

        /* Tabs */
        .tabs { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2rem; flex-wrap: wrap; padding: 0 1rem; }
        .tab-btn { background: none; border: none; font-size: 1rem; cursor: pointer; color: var(--text-secondary); padding-bottom: 5px; transition: all 0.2s; border-bottom: 2px solid transparent;}
        .tab-btn:hover { color: var(--accent-color); }
        .tab-btn.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); font-weight: 600; }

        /* ==================== Controls Bar (Search & Filter) ==================== */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            max-width: 1600px;
            margin: 0 auto 1.5rem auto;
            flex-wrap: wrap;
            gap: 15px;
        }

        .controls-left {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* 1. Tag Select Wrapper */
        .filter-wrapper {
            min-width: 200px;
            width: 220px;
        }
        /* Tom Select Style Override (Minimalist) */
        .ts-control {
            border: 1px solid #ddd !important;
            border-radius: 4px !important;
            padding: 8px 12px !important;
            font-family: var(--font-main) !important;
            box-shadow: none !important;
            height: 42px !important; /* Fixed height to match buttons */
            display: flex;
            align-items: center;
            background-color: #fff;
        }
        .ts-wrapper.focus .ts-control {
            border-color: #999 !important;
        }
        .ts-dropdown {
            border: 1px solid #eee !important;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
            z-index: 100 !important;
        }
        .ts-dropdown .active {
            background-color: #f5f5f5 !important;
            color: #000 !important;
        }

        /* 2. Search Box */
        .search-wrapper {
            display: flex;
            align-items: center;
            height: 42px;
        }
        #search-input {
            height: 100%;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 4px 0 0 4px;
            border-right: none;
            font-family: var(--font-main);
            font-size: 0.9rem;
            width: 180px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        #search-input:focus { border-color: #999; }
        #search-btn {
            height: 100%;
            padding: 0 15px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.2s;
            box-sizing: border-box;
        }
        #search-btn:hover { background-color: #eaeaea; color: #000; border-color: #ccc; }

        /* 3. Icon Button (View Toggle) */
        .icon-btn { 
            background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 0 12px; 
            cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text-secondary); 
            transition: all 0.2s; height: 42px; box-sizing: border-box;
        }
        .icon-btn:hover { border-color: #666; color: #000; }
        .icon-btn.active { background-color: #000; color: #fff; border-color: #000; }
        .icon-btn svg { width: 18px; height: 18px; }
        .toggle-text { font-size: 0.85rem; font-weight: 600; }

        .item-count { font-size: 0.85rem; color: #888; margin-left: auto; }

        /* Gallery Grid */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2rem; padding: 0 5% 40px 5%; max-width: 1600px; margin: 0 auto; min-height: 300px; }
        
        .card { background: var(--card-bg); border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s; border: 1px solid transparent; opacity: 0; animation: cardFadeIn 0.6s ease forwards; }
        .card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); background: #fff; border-color: #eee; }
        
        .card-image-wrapper { width: 100%; padding-top: 60%; position: relative; background: #eee; overflow: hidden; }
        .card-image-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s ease-in; }
        .card-image-wrapper img.loaded { opacity: 1; }
        
        .card-info { padding: 1.2rem; }
        .card-brand { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .card-title { font-size: 1rem; font-weight: 600; margin: 6px 0 10px 0; line-height: 1.4; }
        .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .mini-tag { font-size: 0.7rem; background: #ebebeb; padding: 3px 8px; border-radius: 4px; color: #555; }

        /* Pagination Style */
        .pagination-container { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 20px 0 20px 0; width: 100%; }
        .page-btn { background: #fff; border: 1px solid #ddd; color: #333; min-width: 36px; height: 36px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .page-btn:hover:not(:disabled) { border-color: #000; color: #000; }
        .page-btn.active { background: #000; color: #fff; border-color: #000; }
        .page-btn:disabled { color: #ccc; cursor: not-allowed; border-color: #eee; }
        
        /* Top Pagination Spacing */
        #pagination-top { margin-bottom: 20px; padding-top: 0; }
        #pagination-bottom { margin-bottom: 40px; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.92); backdrop-filter: blur(4px); overflow-y: auto; }
        .modal-content { background: #fff; margin: 40px auto; padding: 40px; width: 90%; max-width: 900px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); border-radius: 8px; position: relative; animation: slideUp 0.3s ease-out; border: 1px solid #f0f0f0; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 2rem; cursor: pointer; color: #aaa; transition: color 0.2s; line-height: 1; }
        .close-btn:hover { color: #000; }
        .modal-body { display: flex; gap: 40px; align-items: flex-start; }
        .modal-image { flex: 1.4; border-radius: 6px; overflow: hidden; background: #f9f9f9; }
        .modal-image img { width: 100%; height: auto; display: block; }
        .modal-info { flex: 1; display: flex; flex-direction: column; }
        .details-list { margin: 25px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 20px 0; }
        .detail-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; }
        .detail-item .label { color: #888; }
        .detail-item .value { font-weight: 600; text-align: right; }
        .action-btn { display: block; background: #111; color: #fff; padding: 14px; text-decoration: none; text-align: center; border-radius: 4px; margin-top: 10px; transition: opacity 0.2s; font-size: 0.9rem; }
        .action-btn:hover { opacity: 0.85; }

        footer { text-align: center; padding: 40px; color: #ccc; font-size: 0.8rem; border-top: 1px solid #fafafa; margin-top: auto;}

        /* Animations */
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes cardFadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive Mobile */
        @media screen and (max-width: 768px) {
            .hero-section { height: 25vh; }
            .controls-bar { flex-direction: column; align-items: stretch; gap: 10px; }
            .controls-left { justify-content: space-between; width: 100%; gap: 10px; }
            
            .filter-wrapper { width: 100%; min-width: unset; order: 1; }
            .search-wrapper { width: 100%; order: 2; }
            #search-input { flex-grow: 1; width: auto; }
            
            .icon-btn { width: 100%; justify-content: center; order: 3; }
            
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 3% 40px 3%; }
            .card-title { font-size: 0.9rem; }
            .modal-content { padding: 20px; margin: 10px auto; width: 92%; margin-top: 50px; }
            .modal-body { flex-direction: column; gap: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-area">
            <img src="images/logo.png" alt="Logo" class="site-logo" onerror="this.style.display='none'">
            <div class="logo-text"><span>Laurence Diecast</span></div>
        </div>
        <div class="lang-switch">
            <button id="lang-en" class="active">EN</button>
            <span>/</span>
            <button id="lang-cn">中</button>
        </div>
    </header>

    <section class="hero-section">
        <img src="images/banner.jpg" alt="Collection Banner" class="hero-img" onerror="this.style.display='none'; this.parentElement.style.backgroundColor='#444'">
    </section>

    <nav class="tabs">
        <button class="tab-btn active" data-filter="BMW">BMW Garage</button>
        <button class="tab-btn" data-filter="Hotwheels">Hotwheels Collection</button>
        <button class="tab-btn" data-filter="all">All On Track</button>
    </nav>

    <div class="controls-bar">
        <div class="controls-left">
            <div class="filter-wrapper">
                <select id="tag-select" placeholder="Filter by Tag..." autocomplete="off">
                    <option value="">All Tags</option>
                </select>
            </div>

            <div class="search-wrapper">
                <input type="text" id="search-input" placeholder="Search model..." autocomplete="off">
                <button id="search-btn">Search</button>
            </div>

            <button id="view-toggle-btn" class="icon-btn" title="Toggle Real Car / Model">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
                    <circle cx="7" cy="17" r="2" />
                    <circle cx="17" cy="17" r="2" />
                </svg>
                <span class="toggle-text" data-en="Real" data-cn="真车">Real</span>
            </button>
        </div>
        <div class="item-count" id="item-count">Loading...</div>
    </div>

    <div id="pagination-top" class="pagination-container"></div>

    <main id="gallery" class="gallery-grid"></main>

    <div id="pagination-bottom" class="pagination-container"></div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="modal-body">
                <div class="modal-image">
                    <img id="modal-img" src="" alt="Model Car">
                </div>
                <div class="modal-info">
                    <h2 id="modal-title"></h2>
                    <p class="brand-tag" id="modal-brand"></p>
                    <div class="details-list">
                        <div class="detail-item"><span class="label" data-en="Brand" data-cn="品牌">Brand</span><span class="value" id="modal-maker"></span></div>
                        <div class="detail-item" id="series-container"><span class="label" data-en="Series" data-cn="系列">Series</span><span class="value" id="modal-series"></span></div>
                        <div class="detail-item"><span class="label" data-en="Color" data-cn="颜色">Color</span><span class="value" id="modal-color"></span></div>
                        <div class="detail-item"><span class="label" data-en="Purchased with" data-cn="购入价">Purchased with</span><span class="value" id="modal-price"></span></div>
                        <div class="detail-item"><span class="label" data-en="Tags" data-cn="标签">Tags</span><span class="value" id="modal-tags"></span></div>
                    </div>
                    <p id="modal-desc" class="description"></p>
                    <div class="modal-actions">
                        <a id="real-car-link" href="#" target="_blank" class="action-btn">
                            <span data-en="Explore Model" data-cn="了解他/她">Explore Model</span> &rarr;
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>“Beyond my means, never beyond memory.”</p>
        <p>&copy; 2026 Laurence Yu's Diecast Collection | Design by Passion</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

    <script>
        /* ==================== JavaScript 逻辑区域 ==================== */
        document.addEventListener('DOMContentLoaded', () => {
            
            // Config
            const ITEMS_PER_PAGE = 15;
            let currentPage = 1;
            
            // State
            let currentLang = 'en';
            let carData = [];
            let currentCategory = 'BMW'; 
            let currentTagFilter = ''; 
            let currentSearchQuery = ''; 
            let showRealCar = false; 

            // Tom Select Instance
            let tagSelectInstance = null;

            // DOM Elements
            const getEl = (id) => document.getElementById(id);
            const gallery = getEl('gallery');
            const paginationContainers = [getEl('pagination-top'), getEl('pagination-bottom')];
            const toggleBtn = getEl('view-toggle-btn');
            const searchInput = getEl('search-input');
            const searchBtn = getEl('search-btn');
            const itemCountLabel = getEl('item-count');
            const modal = getEl('modal');
            const closeBtn = document.querySelector('.close-btn');

            // 1. Initialize Tom Select (Placeholder)
            if(document.getElementById('tag-select')){
                tagSelectInstance = new TomSelect("#tag-select",{
                    create: false,
                    sortField: { field: "text", direction: "asc" },
                    placeholder: "Filter by Tag...",
                    allowEmptyOption: true,
                    onChange: (value) => {
                        currentTagFilter = value;
                        currentPage = 1;
                        updateUI();
                    }
                });
            }

            // 2. Fetch Data
            fetch('cars.json')
                .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
                .then(data => { 
                    carData = data; 
                    refreshTagOptions(); // Load tags
                    updateUI(); // Initial render
                })
                .catch(e => {
                    gallery.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:red;">
                        Data Load Error: ${e.message}<br>Please ensure 'cars.json' exists.
                    </div>`;
                });

            // 3. Search Logic (Click or Enter)
            function performSearch() {
                const query = searchInput.value.trim().toLowerCase();
                if (query === currentSearchQuery) return; // No change
                currentSearchQuery = query;
                currentPage = 1;
                updateUI();
            }
            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });

            // 4. Populate Tags Logic
            function refreshTagOptions() {
                if (!tagSelectInstance) return;

                // Collect tags from *relevant* cars based on Category
                let relevantCars = currentCategory === 'all' 
                    ? carData 
                    : carData.filter(c => c.category === currentCategory);

                const allTags = new Set();
                relevantCars.forEach(car => {
                    if (car.tags) {
                        car.tags.split(';').forEach(tag => {
                            const t = tag.trim();
                            if(t) allTags.add(t);
                        });
                    }
                });

                const sortedTags = Array.from(allTags).sort();

                tagSelectInstance.clear();
                tagSelectInstance.clearOptions();
                tagSelectInstance.addOption({value: '', text: currentLang === 'en' ? 'All Tags' : '全部标签'});
                
                sortedTags.forEach(tag => {
                    tagSelectInstance.addOption({value: tag, text: tag});
                });
                
                tagSelectInstance.sync();
            }

            // 5. UI Update Master Logic
            function updateUI() {
                try {
                    // A. Filter by Category
                    let filtered = currentCategory === 'all' 
                        ? carData.filter(c => c.visible !== false)
                        : carData.filter(c => c.category === currentCategory && c.visible !== false);

                    // B. Filter by Tag
                    if (currentTagFilter && currentTagFilter !== '') {
                        filtered = filtered.filter(c => (c.tags || '').split(';').includes(currentTagFilter));
                    }

                    // C. Filter by Search
                    if (currentSearchQuery) {
                        filtered = filtered.filter(c => {
                            // Search in multiple fields
                            const text = `${c.modelName} ${c.carBrand} ${c.modelBrand} ${c.description_en} ${c.description_cn} ${c.tags}`.toLowerCase();
                            return text.includes(currentSearchQuery);
                        });
                    }

                    // D. Pagination Calc
                    const totalItems = filtered.length;
                    const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
                    
                    if (currentPage > totalPages) currentPage = 1;
                    if (currentPage < 1) currentPage = 1;

                    const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
                    const endIdx = startIdx + ITEMS_PER_PAGE;
                    const carsOnPage = filtered.slice(startIdx, endIdx);

                    // E. Update Count
                    if (itemCountLabel) {
                        itemCountLabel.textContent = totalItems === 0 
                            ? '0 items' 
                            : `${startIdx + 1}-${Math.min(endIdx, totalItems)} of ${totalItems}`;
                    }

                    renderGallery(carsOnPage);
                    renderPagination(totalPages);

                } catch (e) {
                    console.error("UI Update Error:", e);
                }
            }

            // 6. Render Gallery (Lazy Load + Async Decode)
            function renderGallery(cars) {
                gallery.innerHTML = '';
                if (cars.length === 0) {
                    gallery.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:#999;">No cars found matching your criteria.</div>';
                    return;
                }

                cars.forEach((car, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    // Animation delay for smooth entry
                    card.style.animationDelay = `${Math.min(index * 0.05, 1.0)}s`; 
                    card.onclick = () => openModal(car);

                    const tagsList = (car.tags || '').split(';').filter(t => t.trim() !== '');
                    const tagsHTML = tagsList.slice(0, 5).map(t => `<span class="mini-tag">${t}</span>`).join('');

                    let imgSrc = car.imagePath || 'images/placeholder.jpg'; 
                    if (showRealCar && car.realCarImage) imgSrc = car.realCarImage;

                    const title = `${car.modelName || 'Unknown'}`;

                    card.innerHTML = `
                        <div class="card-image-wrapper">
                            <img 
                                src="${imgSrc}" 
                                alt="${title}" 
                                loading="lazy" 
                                decoding="async"
                                onload="this.classList.add('loaded')"
                                onerror="this.onerror=null; this.src='${car.imagePath || ''}'; if(this.src==window.location.href) this.style.display='none';" 
                            >
                        </div>
                        <div class="card-info">
                            <div class="card-brand">${car.modelBrand || ''}</div>
                            <h3 class="card-title">${title}</h3>
                            <div class="card-tags">${tagsHTML}</div>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            }

            // 7. Render Pagination (Top & Bottom)
            function renderPagination(totalPages) {
                const createButtons = () => {
                    const wrapper = document.createElement('div');
                    wrapper.style.display = 'contents';

                    if (totalPages <= 1) return wrapper;

                    // Prev
                    const prevBtn = document.createElement('button');
                    prevBtn.className = 'page-btn';
                    prevBtn.innerHTML = '&lsaquo;';
                    prevBtn.disabled = currentPage === 1;
                    prevBtn.onclick = () => { if(currentPage > 1) { currentPage--; updateUI(); window.scrollTo(0,0); }};
                    wrapper.appendChild(prevBtn);

                    // Numbers (Smart logic: First, Last, Current +/- 2)
                    for (let i = 1; i <= totalPages; i++) {
                        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                            const btn = document.createElement('button');
                            btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                            btn.textContent = i;
                            btn.onclick = () => { currentPage = i; updateUI(); window.scrollTo(0,0); };
                            wrapper.appendChild(btn);
                        } else if (i === currentPage - 3 || i === currentPage + 3) {
                            const span = document.createElement('span');
                            span.textContent = '...';
                            span.style.padding = '0 5px';
                            wrapper.appendChild(span);
                        }
                    }

                    // Next
                    const nextBtn = document.createElement('button');
                    nextBtn.className = 'page-btn';
                    nextBtn.innerHTML = '&rsaquo;';
                    nextBtn.disabled = currentPage === totalPages;
                    nextBtn.onclick = () => { if(currentPage < totalPages) { currentPage++; updateUI(); window.scrollTo(0,0); }};
                    wrapper.appendChild(nextBtn);

                    return wrapper;
                };

                paginationContainers.forEach(container => {
                    if(!container) return;
                    container.innerHTML = '';
                    const content = createButtons();
                    // Move nodes to container (clone logic needed because append moves nodes)
                    // Simplified: re-generate buttons for each container
                    const contentClone = createButtons(); 
                    while(contentClone.firstChild) {
                        container.appendChild(contentClone.firstChild);
                    }
                });
            }

            // Events: Toggle View
            toggleBtn.addEventListener('click', () => { 
                showRealCar = !showRealCar; 
                toggleBtn.classList.toggle('active', showRealCar); 
                updateUI(); 
            });

            // Events: Tabs
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.getAttribute('data-filter') || 'BMW';
                    
                    // Reset filters
                    currentTagFilter = '';
                    currentSearchQuery = '';
                    searchInput.value = '';
                    currentPage = 1;
                    
                    refreshTagOptions(); 
                    updateUI();
                });
            });

            // Events: Language
            document.querySelectorAll('.lang-switch button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const lang = e.target.id === 'lang-en' ? 'en' : 'cn';
                    if(lang === currentLang) return;
                    currentLang = lang;
                    document.querySelectorAll('.lang-switch button').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    // Update static UI
                    document.querySelectorAll('[data-en]').forEach(el => {
                        el.textContent = currentLang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-cn');
                    });
                    
                    // Update Tom Select Placeholder
                    if(tagSelectInstance) {
                        // Hacky update for placeholder option
                        const allTagText = currentLang === 'en' ? 'All Tags' : '全部标签';
                        tagSelectInstance.updateOption('', {value:'', text: allTagText});
                        // Also update placeholder attribute if needed
                        tagSelectInstance.settings.placeholder = currentLang === 'en' ? 'Filter by Tag...' : '按标签筛选...';
                        tagSelectInstance.control_input.placeholder = tagSelectInstance.settings.placeholder;
                    }
                    updateUI();
                });
            });

            // Modal Logic
            function setText(id, text) { const el = getEl(id); if(el) el.textContent = text || '-'; }
            function openModal(car) {
                const imgEl = getEl('modal-img');
                let src = car.imagePath;
                if (showRealCar && car.realCarImage) src = car.realCarImage;
                if(imgEl) { imgEl.src = src || ''; imgEl.onerror = function() { this.src = car.imagePath || ''; }; }

                setText('modal-title', `${car.modelName}`);
                setText('modal-brand', car.category);
                setText('modal-maker', car.modelBrand);
                setText('modal-series', car.seriesNum);
                setText('modal-price', car.price);
                setText('modal-tags', (car.tags || '').split(';').join(', '));
                setText('modal-color', currentLang === 'en' ? car.color : car.color_cn);
                setText('modal-desc', currentLang === 'en' ? car.description_en : car.description_cn);

                const seriesContainer = getEl('series-container');
                if (seriesContainer) seriesContainer.style.display = (car.carBrand === 'BMW' && car.seriesNum) ? 'flex' : 'none';
                
                const linkBtn = getEl('real-car-link');
                if (linkBtn) linkBtn.style.display = car.realCarUrl ? 'block' : 'none';
                if (linkBtn) linkBtn.href = car.realCarUrl || '#';

                modal.style.display = 'block';
                document.body.style.overflow = 'hidden';
            }
            if(closeBtn) closeBtn.onclick = () => { modal.style.display = 'none'; document.body.style.overflow = 'auto'; };
            window.onclick = (e) => { if(e.target == modal) { modal.style.display = 'none'; document.body.style.overflow = 'auto'; }};
        });
    </script>
</body>
</html>
